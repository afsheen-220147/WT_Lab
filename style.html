<!DOCTYPE html>
<html>
<head>
    <title>Style Manipulation</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h2>Style Methods</h2>
    <div id="styleBox" class="box">Styled Box</div>
    <button id="btnCss">Set CSS</button>
    <button id="btnToggle">Toggle Theme</button>

    <script>
        $(document).ready(function(){
            // css()
            $("#btnCss").click(function(){
                $("#styleBox").css({"border-radius": "50%", "border": "5px solid black"});
            });

            // toggleClass()
            $("#btnToggle").click(function(){
                $("body").toggleClass("blue-theme");
            });
        });
    </script>
</body>
</html>
